<header class="navbar">
  <nav>

    <!--routerLinkActive es para q se ponga de colol azul el link cuando estas en ese componente, el otro es para navegar a ese componente -->
    <a routerLink="/semaforo" routerLinkActive="active">Semáforo</a>
    <a routerLink="/lista-frutas" routerLinkActive="active">Lista de frutas</a>
    <!-- el numero sale del service-->
    <a routerLink="/formulario-halloween" routerLinkActive="active">Halloween ({{ halloween.total() }})</a>
    <a routerLink="/padre" routerLinkActive="active">Padre</a>
    <a routerLink="/calculator" routerLinkActive="active">Calculadora</a>
    <a routerLink="/pou" routerLinkActive="active">Pou</a>
  </nav>

  <button
    type="button"
    class="theme-switch"
    role="switch"
    [class.on]="theme.isDark()"
    [attr.aria-checked]="theme.isDark()"
    (click)="theme.toggle()">
    <span class="track">
      <!-- añade la clase on si el tema es oscuro (mueve el thumb) -->
      <span class="thumb">{{ theme.isDark() ? '🌙' : '☀️' }}</span>
    </span>
    <span class="label">{{ theme.isDark() ? 'Oscuro' : 'Claro' }}</span>
  </button>
</header>
