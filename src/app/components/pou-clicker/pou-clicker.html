<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <div class="clicker-container">
  <h1>Clics: {{ contador }}</h1>

  <img
    [src]="animando ? '/PouSonrie.png' : '/POU.png'"
    alt="Pou"
    class="pou-img"
    [class.crece]="animando"
    (animationend)="animando = false"
    (click)="hacerClic()"
    draggable="false"
  >

  <button class="btn-reiniciar" (click)="reiniciar()">Reiniciar</button>
  </div>
</body>
</html>
