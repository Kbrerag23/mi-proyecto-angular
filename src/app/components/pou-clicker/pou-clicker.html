<div class="clicker-container">
  <h1>Clics: {{ contador }}</h1>

  <!-- Cambia la imagen y vuelve a la normal al finalizar la animacion -->
  <img
    [src]="animando ? '/PouSonrie.png' : '/POU.png'"
    alt="Pou"
    class="pou-img"
    [class.crece]="animando"
    (animationend)="animando = false"
    (click)="hacerClic()"
    draggable="false"
  />

  <button class="btn-reiniciar" (click)="reiniciar()">Reiniciar</button>
</div>
