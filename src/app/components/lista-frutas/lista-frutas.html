<section class="cesta-wrapper">
  <h3 class="titulo-cesta">Mi Cesta de Frutas</h3>

  <ul class="elementos-cesta">
    @for (fruta of inventarioFrutas(); track fruta.id) {
      <li class="item-fruta">
        <span>{{ fruta.emoji }} {{ fruta.nombre }}</span>
        <button
          type="button"
          class="btn-like"
          (click)="alternarLike(fruta.id)">
          {{ fruta.like ? '👍' : '👎' }}
        </button>
      </li>
      <!--Esto es solo si la lista esta vacia -->
    } @empty {
      <li class="item-vacio">La cesta está totalmente vacía.</li>
    }
  </ul>

  <button class="btn-nueva-fruta" (click)="incorporarFruta()">
    + Añadir Melocotón
  </button>
</section>
