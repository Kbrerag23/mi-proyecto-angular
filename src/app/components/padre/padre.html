<div class="padre-container">
  <h2>Componente Padre</h2>

  <div class="respuesta-box">
    <p><strong>Buzón del Padre:</strong> {{ respuestaDelHijo() }}</p>
  </div>

  @for (hijo of hijos; track hijo) {
    <app-hijo
      [mensaje]="mensajeDinamico()"
      (mensajeAlPadre)="recibirMensaje($event)">
    </app-hijo>
  }
</div>
